<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Soluciones & Desarrollo Peyraga — Sitio en construcción.">
  <meta name="theme-color" content="#0f172a">
  <title>Soluciones &amp; Desarrollo Peyraga — En construcción</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --text: #f8fafc;
      --text-muted: #cbd5e1;
      --blue-light: #38bdf8;
      --purple: #818cf8;
      --green: #34d399;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }
    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.25;
      z-index: 0;
    }
    .glow--1 { width: 420px; height: 420px; background: var(--blue-light); top: -120px; left: -100px; }
    .glow--2 { width: 380px; height: 380px; background: var(--purple); bottom: -120px; right: -80px; }
    .wrap { position: relative; z-index: 1; max-width: 620px; }
    .badge {
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--blue-light);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 999px;
      padding: 8px 18px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .pulse {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .icon { color: var(--blue-light); margin-bottom: 24px; }
    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 6vw, 3.4rem);
      line-height: 1.1;
      margin-bottom: 16px;
    }
    h1 .accent {
      background: linear-gradient(120deg, var(--blue-light), var(--purple));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 1.15rem;
      color: var(--text);
      margin-bottom: 20px;
    }
    p.desc { color: var(--text-muted); font-size: 1.05rem; line-height: 1.7; margin-bottom: 40px; }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Space Mono', monospace;
      font-size: 0.9rem;
      color: var(--blue-light);
      text-decoration: none;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 10px;
      padding: 12px 22px;
      transition: background 0.2s, border-color 0.2s;
    }
    .back:hover { background: rgba(56, 189, 248, 0.1); border-color: var(--blue-light); }
  </style>
</head>
<body>
  <div class="glow glow--1"></div>
  <div class="glow glow--2"></div>

  <div class="wrap">
    <span class="badge"><span class="pulse"></span>En construcción</span>

    <div class="icon">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 20h20"/><path d="M4 20V8l8-4 8 4v12"/><path d="M9 20v-6h6v6"/><path d="M12 4v4"/>
      </svg>
    </div>

    <h1>Soluciones &amp; Desarrollo <span class="accent">Peyraga</span></h1>
    <p class="subtitle">Estamos trabajando en algo grande 🚧</p>
    <p class="desc">Este espacio está en construcción. Muy pronto vas a encontrar acá los servicios y proyectos de mi emprendimiento. ¡Gracias por la paciencia!</p>

    <a class="back" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Volver al portafolio
    </a>
  </div>
</body>
</html>
